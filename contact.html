        .contact-card:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
        .contact-card-featured { grid-column: 1 / -1; min-height: 176px; border-color: var(--ink); background: var(--ink); color: #fff; }

        .contact-icon { width: 32px; height: 32px; flex: 0 0 32px; }
        .contact-card-copy { min-width: 0; display: grid; gap: 5px; }
        .contact-card-label { font-size: 12px; font-weight: 650; letter-spacing: .06em; }
        .contact-card-value { font-size: clamp(1rem, 1.7vw, 1.15rem); font-weight: 600; line-height: 1.6; overflow-wrap: anywhere; }
        .contact-card-featured .contact-card-label { color: #d0d0d0; }
        @media (max-width: 700px) {

            .contact-card-featured { grid-column: auto; }
        }
